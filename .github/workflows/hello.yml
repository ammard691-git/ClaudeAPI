name: Test and Describe
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest -v
      - name: Generate project description
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pip install anthropic
          python describe_repo.py
      - name: Commit description
        run: |
          if [ -f PROJECT_DESCRIPTION.md ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add PROJECT_DESCRIPTION.md
            git diff --cached --quiet || (git commit -m "Update AI project description [skip ci]" && git push)
          fi
